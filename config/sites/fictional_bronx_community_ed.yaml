# =============================================================================
#  FICTIONAL SITE PROFILE -- NOT A REAL HOSPITAL
# =============================================================================
#  "Riverside Commons Community ED" is an invented emergency department.
#  Every number below is an ILLUSTRATIVE ASSUMPTION written for this project
#  so the simulation has something plausible to run. None of these values
#  were taken from, or represent, Lincoln, St. Barnabas, or any other real
#  hospital, in the Bronx or elsewhere.
#
#  "Bronx-inspired" means only that the scenario context (a busy urban
#  safety-net ED with boarding pressure) reflects challenges widely discussed
#  in public reporting about Bronx emergency care.
# =============================================================================

schema_version: 2

site:
  site_id: riverside_commons_ed
  display_name: "Riverside Commons Community ED (fictional)"
  fictional: true
  disclaimer: >-
    Fictional emergency department. All values are illustrative assumptions
    for simulation and teaching; they do not describe any real hospital.

provenance:
  label: SYNTHETIC
  source: "Illustrative assumptions written for this project; not derived from any hospital's data."

staffing:
  # Three 8-hour shifts covering the full day. Counts are clinicians on duty
  # *at the same time* during that shift, not total employees.
  shifts:
    - { name: day,     start_hour: 7,  duration_hours: 8 }   # 07:00-15:00
    - { name: evening, start_hour: 15, duration_hours: 8 }   # 15:00-23:00
    - { name: night,   start_hour: 23, duration_hours: 8 }   # 23:00-07:00
  physicians_on_duty:
    day: 4
    evening: 4
    night: 2
  nurses_on_duty:
    day: 14
    evening: 14
    night: 10
  source_note: "Illustrative assumption sized for ~190 expected daily arrivals; not real staffing data."

treatment_spaces:
  acute_beds: 36
  resuscitation_bays: 3
  fast_track_chairs: 8
  hallway_spaces: 6
  source_note: "Illustrative assumption for a mid-to-large urban ED; not a real floor plan."

arrivals:
  # Average patients arriving in each clock hour; index 0 = 00:00-00:59.
  # Shape (overnight low, late-morning peak) follows the widely described
  # daily ED arrival pattern. Expected total: 190.5 patients/day.
  hourly_rates:
    - 5.5   # 00:00
    - 4.5   # 01:00
    - 4.0   # 02:00
    - 3.5   # 03:00
    - 3.0   # 04:00
    - 3.0   # 05:00
    - 3.5   # 06:00
    - 5.0   # 07:00
    - 7.5   # 08:00
    - 10.0  # 09:00
    - 11.5  # 10:00
    - 12.0  # 11:00
    - 12.0  # 12:00
    - 11.5  # 13:00
    - 11.0  # 14:00
    - 11.0  # 15:00
    - 10.5  # 16:00
    - 10.5  # 17:00
    - 10.0  # 18:00
    - 9.5   # 19:00
    - 9.0   # 20:00
    - 8.5   # 21:00
    - 7.5   # 22:00
    - 6.5   # 23:00
  # Scales every hour of that weekday. Must average 1.0 across the week.
  # Shape (busier early week) is an illustrative assumption.
  day_of_week_multipliers:
    monday: 1.10
    tuesday: 1.03
    wednesday: 1.00
    thursday: 0.98
    friday: 0.98
    saturday: 0.95
    sunday: 0.96
  source_note: "Illustrative hourly and weekday pattern; magnitudes are assumptions, not observed counts."

# -----------------------------------------------------------------------------
# PATIENT MIX -- all values are ILLUSTRATIVE ASSUMPTIONS, not measurements.
# Per-acuity values are CONDITIONAL probabilities: e.g. lab 2: 0.85 means
# "85% of ESI-2 patients need a lab test".
# Implied overall shares: admission 19.79%, lab 55.4%, imaging 44.8%.
# -----------------------------------------------------------------------------
patient_mix:
  acuity_distribution:            # share of arrivals at each ESI level; sums to 1
    1: 0.01
    2: 0.15
    3: 0.45
    4: 0.30
    5: 0.09
  lab_probability_by_acuity:
    1: 0.95
    2: 0.85
    3: 0.75
    4: 0.25
    5: 0.05
  imaging_probability_by_acuity:
    1: 0.85
    2: 0.65
    3: 0.55
    4: 0.30
    5: 0.05
  admission_probability_by_acuity:  # must imply inpatient.ed_admission_fraction (0.20)
    1: 0.80
    2: 0.45
    3: 0.25
    4: 0.03
    5: 0.01
  source_note: "Illustrative assumptions with the general shape of a busy urban ED; not derived from any hospital's data and not calibrated to CMS or NYS measures."

# -----------------------------------------------------------------------------
# SERVICE TIMES -- assumed durations of WORK (minutes), used by the Milestone 4
# simulation. Not waits, not lengths of stay. median = typical; p90 = 9 in 10
# finish within this time.
# -----------------------------------------------------------------------------
service_times:
  triage: { median: 8, p90: 15 }
  provider_evaluation_by_acuity:
    1: { median: 60, p90: 120 }
    2: { median: 45, p90: 90 }
    3: { median: 35, p90: 70 }
    4: { median: 20, p90: 40 }
    5: { median: 15, p90: 30 }
  lab_turnaround: { median: 60, p90: 120 }
  imaging_turnaround: { median: 75, p90: 150 }
  discharge_process: { median: 30, p90: 75 }
  source_note: "Illustrative task-duration assumptions for simulation; not measured at any hospital."

inpatient:
  staffed_beds: 300
  typical_occupancy: 0.93       # high occupancy -> boarding pressure
  ed_admission_fraction: 0.20   # 20% of ED patients admitted
  source_note: "Illustrative assumption representing a high-occupancy hospital; not real census data."
