# HELD-OUT cases. Written after the dev-set fixes, with new phrasings and attack
# styles, and locked (heldout.lock.json) BEFORE the verifier was run on them.
# The lock records the first, blind run. Do not tune rules on these cases and
# then report them as independent evidence; see docs/AI_EVALUATION.md.
#
# Limitation: the same author wrote the rules and these cases, so "held-out"
# here means "not used for tuning", not "independently authored".

