[[case]]
id = "r3-021"
packet = "night_physician"
kind = "adversarial"
category = "mislabeling"
expected = "REJECT"
expected_checks = ["claim_alignment"]
evidence_ids = ["M:boarding_p90"]
rationale = "Presents the 90th percentile as the longest (maximum) boarding time."
[[case.patch]]
