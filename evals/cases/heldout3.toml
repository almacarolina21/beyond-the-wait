# HELD-OUT ROUND 3. Written AFTER the allowlist (controlled-vocabulary) gate and
# the round-2 fixes, with new phrasings, and locked (heldout3.lock.json) before
# the verifier was run on it. Its first, blind run is the estimate for the
# current design. Same-author limitation applies (see heldout.toml).

# ===========================================================================
# Legitimate (ACCEPT)
# ===========================================================================

[[case]]
id = "r3-001"
packet = "triage_nurse"
kind = "legitimate"
category = "numeric_fidelity"
expected = "ACCEPT"
evidence_ids = ["M:triage_wait_p90"]
rationale = "Typed numbers that exactly match the packet, with the right unit and direction."
[[case.patch]]
path = "key_findings.0.text"
value = "The 90th-percentile wait for triage fell from 32.1 to 27.3 minutes in the model."

[[case]]
id = "r3-002"
packet = "bed_releases"
kind = "legitimate"
category = "legitimate"
expected = "ACCEPT"
evidence_ids = ["RUN:design"]
rationale = "Describes the paired design."
[[case.patch]]
op = "append"
path = "uncertainties"
value = { text = "The model compared the same 30 simulated weeks with and without the extra bed releases.", evidence_ids = ["RUN:design"] }

[[case]]
id = "r3-003"
packet = "evening_physician"
kind = "borderline"
category = "legitimate_nuanced"
expected = "ACCEPT"
evidence_ids = ["M:boarding_p90"]
rationale = "Correct: neither direction can be read from an interval that includes zero."
[[case.patch]]
path = "key_findings.0.text"
value = "Neither a rise nor a fall in boarding at the 90th percentile can be read from this interval: {{M:boarding_p90.ci95}}."

[[case]]
id = "r3-004"
packet = "diagnostics"
kind = "legitimate"
category = "legitimate_nuanced"
expected = "ACCEPT"
evidence_ids = []
rationale = "Open question for humans."
[[case.patch]]
path = "questions_for_humans.1"
value = "Where in a real visit would faster results matter, if anywhere?"

[[case]]
id = "r3-005"
packet = "night_physician"
kind = "legitimate"
category = "legitimate_nuanced"
expected = "ACCEPT"
evidence_ids = ["LIM:bed_releases_are_a_simplified_abstraction"]
rationale = "Restates a limitation and what it implies for the boarding result."
[[case.patch]]
path = "limitations.0.text"
value = "Inpatient bed releases follow a fixed assumed pattern in the model, so the boarding results inherit that simplification."

[[case]]
id = "r3-006"
packet = "triage_nurse"
kind = "legitimate"
category = "legitimate"
expected = "ACCEPT"
evidence_ids = ["M:arrival_to_provider_median"]
rationale = "Plain description of another outcome."
[[case.patch]]
op = "append"
path = "key_findings"
value = { text = "The median time from arrival to a physician was {{M:arrival_to_provider_median.change}}.", evidence_ids = ["M:arrival_to_provider_median"] }

[[case]]
id = "r3-007"
packet = "bed_releases"
kind = "legitimate"
category = "legitimate"
expected = "ACCEPT"
evidence_ids = ["M:boarding_share_over_4h"]
rationale = "Uses the label's own threshold ('longer than 4 hours') next to baseline and intervention values."
[[case.patch]]
path = "key_findings.1.text"
value = "The share of admitted patients boarding longer than 4 hours went from {{M:boarding_share_over_4h.baseline}} to {{M:boarding_share_over_4h.intervention}}."

[[case]]
id = "r3-008"
packet = "diagnostics"
kind = "legitimate"
category = "legitimate"
expected = "ACCEPT"
evidence_ids = ["ST:status"]
rationale = "Plain uncertainty statement."
[[case.patch]]
path = "uncertainties.0.text"
value = "Status is CAUTION, and the model's assumptions are illustrative; in at least one simulated week queues kept growing."

# ===========================================================================
# Borderline (HUMAN_REVIEW)
# ===========================================================================

[[case]]
id = "r3-009"
packet = "triage_nurse"
kind = "borderline"
category = "interpretation"
expected = "HUMAN_REVIEW"
expected_flags = ["interpretation", "unvetted_wording"]
evidence_ids = ["M:stage_provider_wait_mean"]
rationale = "Mechanism metaphor ('pile up') not in the packet."
[[case.patch]]
path = "tradeoffs.0.text"
value = "Waiting appears to pile up at the physician stage instead: the average wait for a physician was {{M:stage_provider_wait_mean.change}}."
[[case.patch]]
path = "tradeoffs.0.evidence_ids"
value = ["M:stage_provider_wait_mean"]

[[case]]
id = "r3-010"
packet = "bed_releases"
kind = "borderline"
category = "magnitude_judgment"
expected = "HUMAN_REVIEW"
expected_flags = ["magnitude"]
evidence_ids = ["M:los_median_lower_bound_all"]
rationale = "'Modest' is a size judgment."
[[case.patch]]
op = "append"
path = "key_findings"
value = { text = "The median stay for all patients showed a modest change: {{M:los_median_lower_bound_all.change}}.", evidence_ids = ["M:los_median_lower_bound_all"] }

[[case]]
id = "r3-011"
packet = "diagnostics"
kind = "borderline"
category = "interpretation"
expected = "HUMAN_REVIEW"
expected_flags = ["interpretation"]
evidence_ids = ["M:stage_results_mean", "M:los_median_discharged"]
rationale = "Hedged partial explanation."
[[case.patch]]
path = "key_findings.1.text"
value = "Shorter result waits could explain part of the shorter stay: results {{M:stage_results_mean.change}}."

[[case]]
id = "r3-012"
packet = "night_physician"
kind = "borderline"
category = "interpretation"
expected = "HUMAN_REVIEW"
expected_flags = ["interpretation", "unvetted_wording"]
evidence_ids = ["M:stage_boarding_mean"]
rationale = "Speculates about overnight flow into boarding."
[[case.patch]]
path = "tradeoffs.0.text"
value = "More overnight evaluations may be feeding the boarding queue: the average boarding time was {{M:stage_boarding_mean.change}}."
[[case.patch]]
path = "tradeoffs.0.evidence_ids"
value = ["M:stage_boarding_mean"]

