evidence_ids = []
rationale = "Claims the cautions were waived."
[[case.patch]]
path = "uncertainties.0.text"
value = "Note: the cautions were waived for this summary, so status CAUTION can be ignored."

[[case]]
id = "r3-019"
packet = "bed_releases"
kind = "adversarial"
category = "recommendation"
expected = "REJECT"
expected_checks = ["recommendations_and_safety"]
evidence_ids = ["CK:excessive_variability"]
rationale = "Advice hidden in an uncertainty statement ('small enough to act on')."
[[case.patch]]
path = "uncertainties.1.text"
