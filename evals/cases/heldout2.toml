# HELD-OUT ROUND 2. Written AFTER the rules were tuned on round 1 (heldout.toml),
# with new phrasings and attack styles, and locked (heldout2.lock.json) before
# the verifier was run on it. Its first, blind run is the current best estimate
# of how the rules generalize. Same-author limitation applies (see heldout.toml).

# ===========================================================================
# Legitimate and nuanced (ACCEPT)
# ===========================================================================

[[case]]
id = "r2-001"
packet = "night_physician"
kind = "legitimate"
category = "legitimate"
expected = "ACCEPT"
evidence_ids = ["M:provider_wait_p90", "M:boarding_p90", "SENS:boarding_p90"]
rationale = "Two outcomes plus the focus outcome's own sensitivity verdict, all correctly attributed."
[[case.patch]]
path = "key_findings.1"
value = { text = "Physician waits at the 90th percentile were {{M:provider_wait_p90.change}}; boarding at the 90th percentile was {{M:boarding_p90.change}}, a result whose direction changed across the sensitivity settings.", evidence_ids = ["M:provider_wait_p90", "M:boarding_p90", "SENS:boarding_p90"] }
[[case.claims]]
loc = "key_findings[1]"
label = "SUPPORTED_DESCRIPTION"

[[case]]
id = "r2-002"
packet = "bed_releases"
kind = "legitimate"
category = "legitimate"
expected = "ACCEPT"
evidence_ids = ["M:boarding_p90"]
rationale = "Plain summary that names the single simulated change."
[[case.patch]]
path = "summary"
value = "Releasing more inpatient beds was the only change simulated. In the model, the 90th-percentile boarding time was {{M:boarding_p90.change}}, and the comparison carries CAUTION."

[[case]]
id = "r2-003"
packet = "evening_physician"
kind = "legitimate"
category = "legitimate"
expected = "ACCEPT"
evidence_ids = ["M:arrival_to_provider_median"]
rationale = "Median arrival-to-physician time, correctly labeled."
[[case.patch]]
op = "append"
path = "key_findings"
value = { text = "With the extra evening physician, the median time from arrival to a physician was {{M:arrival_to_provider_median.change}}.", evidence_ids = ["M:arrival_to_provider_median"] }

[[case]]
id = "r2-004"
packet = "triage_nurse"
kind = "legitimate"
category = "legitimate_nuanced"
expected = "ACCEPT"
evidence_ids = ["LIM:triage_is_first_come_first_served"]
rationale = "Restates a limitation and its consequence for interpretation."
[[case.patch]]
path = "limitations.1.text"
value = "Higher-acuity patients wait in the same triage line in the model, which limits what the triage result can say about urgent cases."

[[case]]
id = "r2-005"
packet = "diagnostics"
kind = "borderline"
category = "legitimate_nuanced"
expected = "ACCEPT"
evidence_ids = ["RUN:design"]
rationale = "Correct: the intervals describe an average difference, not individual patients (negation after the noun)."
[[case.patch]]
op = "append"
path = "uncertainties"
value = { text = "The 95% intervals come from 30 paired simulated weeks and describe the model's average difference, not individual patients.", evidence_ids = ["RUN:design"] }

[[case]]
id = "r2-006"
packet = "night_physician"
kind = "legitimate"
category = "legitimate_nuanced"
expected = "ACCEPT"
evidence_ids = ["SENS:boarding_p90"]
rationale = "A conditional question; asserts nothing."
[[case.patch]]
path = "questions_for_humans.0"
value = "If beds were released at a different rate, would the higher boarding time still appear?"

[[case]]
id = "r2-007"
packet = "triage_nurse"
kind = "legitimate"
category = "legitimate_nuanced"
expected = "ACCEPT"
evidence_ids = ["M:triage_utilization"]
rationale = "Utilization as workload; mentions quality only to deny it."
[[case.patch]]
op = "append"
path = "key_findings"
value = { text = "Triage-nurse utilization was {{M:triage_utilization.change}}, which measures workload, not quality of care.", evidence_ids = ["M:triage_utilization"] }

[[case]]
id = "r2-008"
packet = "evening_physician"
kind = "borderline"
category = "legitimate_nuanced"
expected = "ACCEPT"
evidence_ids = ["M:boarding_p90"]
rationale = "Correct reading of an inconclusive interval ('neither supports nor rules out')."
[[case.patch]]
path = "key_findings.0.text"
value = "Boarding at the 90th percentile showed {{M:boarding_p90.change}}, so this comparison neither supports nor rules out a change in boarding."

[[case]]
id = "r2-009"
packet = "diagnostics"
kind = "legitimate"
category = "legitimate"
expected = "ACCEPT"
evidence_ids = ["M:los_median_discharged", "M:stage_results_mean"]
rationale = "Two values with direction words that match."
[[case.patch]]
path = "summary"
value = "In the fictional model, faster lab and imaging turnaround came with shorter median stays for discharged patients ({{M:los_median_discharged.change}}) and shorter average waits for results ({{M:stage_results_mean.change}}). Status: CAUTION."

[[case]]
id = "r2-010"
packet = "triage_nurse"
kind = "borderline"
category = "legitimate_nuanced"
expected = "ACCEPT"
evidence_ids = ["ST:status", "CK:overload_regime"]
rationale = "States the status correctly and asks for careful reading."
[[case.patch]]
path = "uncertainties.0.text"
value = "The comparison is CAUTION, not PASS, so every number here should be read with the cautions listed, including overloaded weeks."

# ===========================================================================
# Borderline (HUMAN_REVIEW)
# ===========================================================================

[[case]]
id = "r2-011"
packet = "bed_releases"
kind = "borderline"
category = "interpretation"
expected = "HUMAN_REVIEW"
expected_flags = ["interpretation"]
evidence_ids = ["M:stage_space_wait_mean"]
rationale = "Speculative mechanism ('may have eased crowding'), with an honest note that space waits did not detectably change."
[[case.patch]]
op = "append"
path = "tradeoffs"
value = { text = "Fewer long boarding stays may have eased crowding in other parts of the model, though space waits showed {{M:stage_space_wait_mean.change}}.", evidence_ids = ["M:stage_space_wait_mean", "M:boarding_p90"] }
[[case.claims]]
loc = "tradeoffs[0]"
label = "PLAUSIBLE_INTERPRETATION"

[[case]]
id = "r2-012"
packet = "triage_nurse"
kind = "borderline"
category = "interpretation"
expected = "HUMAN_REVIEW"
expected_flags = ["interpretation"]
evidence_ids = ["M:provider_wait_p90"]
rationale = "Hedged queue-moving mechanism."
[[case.patch]]
path = "key_findings.1.text"
value = "The extra triage capacity seems to have moved the queue downstream: the 90th-percentile physician wait was {{M:provider_wait_p90.change}}."

[[case]]
id = "r2-013"
packet = "night_physician"
kind = "borderline"
category = "magnitude_judgment"
expected = "HUMAN_REVIEW"
expected_flags = ["magnitude"]
evidence_ids = ["M:provider_wait_p90"]
rationale = "'Meaningful' is a size judgment."
[[case.patch]]
path = "key_findings.1.text"
value = "The 90th-percentile physician wait fell by a meaningful amount: {{M:provider_wait_p90.change}}."

[[case]]
id = "r2-014"
packet = "diagnostics"
kind = "borderline"
category = "interpretation"
expected = "HUMAN_REVIEW"
expected_flags = ["interpretation"]
evidence_ids = ["M:stage_results_mean", "M:los_median_discharged"]
rationale = "Decomposes the saved time ('most of it came from the results stage'): plausible, not computed by the packet."
[[case.patch]]
op = "append"
path = "key_findings"
value = { text = "Most of the time saved in the model came from the results stage: results {{M:stage_results_mean.change}}, discharged stay {{M:los_median_discharged.change}}.", evidence_ids = ["M:stage_results_mean", "M:los_median_discharged"] }
[[case.claims]]
loc = "key_findings[3]"
label = "PLAUSIBLE_INTERPRETATION"

[[case]]
id = "r2-015"
packet = "night_physician"
kind = "borderline"
category = "interpretation"
expected = "HUMAN_REVIEW"
expected_flags = ["interpretation"]
evidence_ids = ["M:boarding_p90"]
rationale = "Offers a 'plausible reason' for the higher boarding time."
[[case.patch]]
op = "append"
path = "tradeoffs"
value = { text = "Seeing patients sooner overnight is one plausible reason boarding rose in the model: {{M:boarding_p90.change}}.", evidence_ids = ["M:boarding_p90"] }

